[package]
name = "modbus-senml-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
rumqttc = "0.25.1"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "signal"] }
tokio-modbus = "0.17.0"
tokio-serial = "5.5.0"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }
rcgen = "0.14.10"
rumqttd = "0.20.0"
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-modbus = { version = "0.17.0", features = ["tcp-server"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "abort" intentionally omitted: it would prevent the supervisor
# (src/modbus/supervisor.rs) from catching and respawning panicked tasks.
