# Checks Cargo.lock against the RustSec advisory database. Runs daily
# because new advisories are published without any change to this repo;
# a failed scheduled run is emailed to whoever last changed the cron.
# Accepted advisories are listed with reasons in .cargo/audit.toml.

name: Audit

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit
      - run: cargo audit
